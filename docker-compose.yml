services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schulplan
      POSTGRES_PASSWORD: schulplan
      POSTGRES_DB: schulplan
    ports:
      - "5432:5432"
    volumes:
      - schulplan_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schulplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://schulplan:schulplan@db:5432/schulplan
      JWT_SECRET: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

volumes:
  schulplan_db_data:
